name: Close Issue on Merge to Dev

on:
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  close-issue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            // Ищем все #число после ключевых слов
            const re = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+(#[0-9]+(?:\s+#[0-9]+)*)/gi;
            let match;
            while ((match = re.exec(body)) !== null) {
              // Извлекаем все номера задач из найденной группы
              const numbers = match[1].match(/#(\d+)/g);
              if (numbers) {
                for (const num of numbers) {
                  const issue_number = parseInt(num.replace('#', ''), 10);
                  console.log(`Закрываю задачу #${issue_number}`);
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue_number,
                    state: 'closed'
                  });
                }
              }
            }
