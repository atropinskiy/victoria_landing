[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "B008",  # function call in default argument (common FastAPI Depends() pattern)
    "UP046", # PEP 695 generics don't play well with Pydantic's Generic[T] models
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
