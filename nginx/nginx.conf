server {
    listen 80;
    server_name kezikvictoria.ru www.kezikvictoria.ru;

    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;
    server_name kezikvictoria.ru www.kezikvictoria.ru;

    ssl_certificate /etc/letsencrypt/live/kezikvictoria.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kezikvictoria.ru/privkey.pem;


    location /api/ {
        proxy_pass http://app:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header X-Forwarded-Host $host;
    }


    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js websocket / hot reload
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
